# WordPress — mandatory HTTPS entrypoint
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name klaayoun.42.fr;

	ssl_certificate     /etc/nginx/ssl/klaayoun.crt;
	ssl_certificate_key /etc/nginx/ssl/klaayoun.key;
	ssl_protocols       TLSv1.2 TLSv1.3;

	# Base image defaults to 1m, too small for WordPress media uploads.
	client_max_body_size 64m;

	root /var/www/html;
	index index.php index.html;

	location / {
		try_files $uri $uri/ /index.php?$args;
	}

	location ~ \.php$ {
		fastcgi_split_path_info ^(.+\.php)(/.+)$;
		fastcgi_param PATH_INFO $fastcgi_path_info;
		include fastcgi.conf;
		fastcgi_pass wordpress:9000;
	}
}

# Bonus: Adminer
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name adminer.klaayoun.42.fr;

	ssl_certificate     /etc/nginx/ssl/klaayoun.crt;
	ssl_certificate_key /etc/nginx/ssl/klaayoun.key;
	ssl_protocols       TLSv1.2 TLSv1.3;

	location / {
		proxy_pass http://adminer:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}
}

# Bonus: static site
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name static.klaayoun.42.fr;

	ssl_certificate     /etc/nginx/ssl/klaayoun.crt;
	ssl_certificate_key /etc/nginx/ssl/klaayoun.key;
	ssl_protocols       TLSv1.2 TLSv1.3;

	location / {
		proxy_pass http://static:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
	}
}
