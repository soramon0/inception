worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;
	sendfile      on;
	keepalive_timeout 65;

	# WordPress — mandatory HTTPS entrypoint
	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name klaayoun.42.fr;

		ssl_certificate     /etc/nginx/ssl/klaayoun.crt;
		ssl_certificate_key /etc/nginx/ssl/klaayoun.key;
		ssl_protocols       TLSv1.2 TLSv1.3;
		ssl_ciphers         HIGH:!aNULL:!MD5;

		root /var/www/html;
		index index.php index.html;

		location / {
			try_files $uri $uri/ /index.php?$args;
		}

		location ~ \.php$ {
			fastcgi_split_path_info ^(.+\.php)(/.+)$;
			fastcgi_pass wordpress:9000;
			fastcgi_index index.php;
			include fastcgi_params;
			fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
			fastcgi_param PATH_INFO $fastcgi_path_info;
		}
	}

	# Bonus: Adminer
	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name adminer.klaayoun.42.fr;

		ssl_certificate     /etc/nginx/ssl/klaayoun.crt;
		ssl_certificate_key /etc/nginx/ssl/klaayoun.key;
		ssl_protocols       TLSv1.2 TLSv1.3;

		location / {
			proxy_pass http://adminer:8080;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
		}
	}

	# Bonus: static site
	server {
		listen 443 ssl;
		listen [::]:443 ssl;
		server_name static.klaayoun.42.fr;

		ssl_certificate     /etc/nginx/ssl/klaayoun.crt;
		ssl_certificate_key /etc/nginx/ssl/klaayoun.key;
		ssl_protocols       TLSv1.2 TLSv1.3;

		location / {
			proxy_pass http://static:8080;
			proxy_set_header Host $host;
		}
	}
}
